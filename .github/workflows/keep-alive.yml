name: Keep backend awake

# Render 무료 플랜은 15분간 요청이 없으면 서버가 잠들어서, 다음 요청이 30~60초씩 느려진다.
# 10분마다 헬스체크 엔드포인트에 핑을 보내서 서버가 잠들지 않게 유지한다.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 90 https://skala-study-platform.onrender.com/api/health
